<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Candidato – AMAC | Bolsa De Trabajo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="registro-candidato.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="index.html">
        <img class="site-header__logo" src="assets/amac-logo.png" alt="AMAC | Bolsa De Trabajo" width="471" height="75">
      </a>

      <button class="site-header__toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Abrir menú de navegación">
        <span class="site-header__toggle-bar"></span>
        <span class="site-header__toggle-bar"></span>
        <span class="site-header__toggle-bar"></span>
      </button>

      <nav class="site-nav" id="site-nav" aria-label="Navegación principal">
        <ul class="site-nav__list">
          <li class="site-nav__item">
            <a class="site-nav__link" href="index.html">
              <img class="site-nav__icon" alt="Ícono de búsqueda" width="20" height="20"
                   src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fafafa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='11' cy='11' r='8'/%3E%3Cpath d='m21 21-4.3-4.3'/%3E%3C/svg%3E">
              Buscar Empleos
            </a>
          </li>
          <li class="site-nav__item">
            <button class="site-nav__link" type="button">
              Registro
              <img class="site-nav__icon" alt="Flecha desplegable" width="20" height="20"
                   src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fafafa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E">
            </button>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="login.html">
              Iniciar Sesión
              <img class="site-nav__icon site-nav__icon--user" alt="Ícono de usuario" width="24" height="24"
                   src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fafafa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2'/%3E%3Ccircle cx='12' cy='7' r='4'/%3E%3C/svg%3E">
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="register" aria-labelledby="register-title">
      <form class="register-card" action="#" method="post">
        <header class="register-card__header">
          <h1 class="register-card__title" id="register-title">Registro de Candidato</h1>
          <p class="register-card__subtitle">Complete sus datos para poder postularse a los empleos.</p>
        </header>

        <div class="register-card__fields">
          <div class="field">
            <label class="field__label" for="reg-nombre">Nombre Completo</label>
            <div class="field__control">
              <img class="field__icon" alt="Ícono de usuario" width="20" height="20"
                   src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2'/%3E%3Ccircle cx='12' cy='7' r='4'/%3E%3C/svg%3E">
              <input class="field__input" id="reg-nombre" type="text" name="nombre" autocomplete="name" placeholder="Ej. María García López">
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="reg-edad">Edad</label>
            <div class="field__control">
              <img class="field__icon" alt="Ícono de calendario" width="20" height="20"
                   src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 2v4'/%3E%3Cpath d='M16 2v4'/%3E%3Crect x='3' y='4' width='18' height='18' rx='2'/%3E%3Cpath d='M3 10h18'/%3E%3C/svg%3E">
              <input class="field__input" id="reg-edad" type="number" name="edad" inputmode="numeric" min="0" placeholder="Ej. 62">
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="reg-email">Correo Electrónico</label>
            <div class="field__control">
              <img class="field__icon" alt="Ícono de correo" width="20" height="20"
                   src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='4' width='20' height='16' rx='2'/%3E%3Cpath d='m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'/%3E%3C/svg%3E">
              <input class="field__input" id="reg-email" type="email" name="email" autocomplete="email" placeholder="ejemplo@correo.com">
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="reg-telefono">Teléfono de Contacto</label>
            <div class="field__control">
              <img class="field__icon" alt="Ícono de teléfono" width="20" height="20"
                   src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z'/%3E%3C/svg%3E">
              <input class="field__input" id="reg-telefono" type="tel" name="telefono" autocomplete="tel" placeholder="Ej. 81 1234 5678">
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="reg-experiencia">Experiencia laboral principal</label>
            <p class="field__hint" id="reg-experiencia-hint">Breve resumen de su experiencia o habilidades principales.</p>
            <textarea class="field__textarea" id="reg-experiencia" name="experiencia" aria-describedby="reg-experiencia-hint" placeholder="Ej. Más de 10 años en atención al cliente en el sector retail. Habilidades de comunicación, resolución de conflictos y trabajo en equipo..."></textarea>
          </div>

          <div class="field">
            <label class="field__label" for="reg-password">Crear Contraseña</label>
            <div class="field__control">
              <img class="field__icon" alt="Ícono de candado" width="20" height="20"
                   src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='11' width='18' height='11' rx='2' ry='2'/%3E%3Cpath d='M7 11V7a5 5 0 0 1 10 0v4'/%3E%3C/svg%3E">
              <input class="field__input field__input--password" id="reg-password" type="password" name="password" autocomplete="new-password" minlength="8" aria-describedby="reg-password-note" placeholder="Mínimo 8 caracteres">
              <button class="field__toggle" type="button" aria-controls="reg-password" aria-pressed="false" aria-label="Mostrar contraseña">
                <img class="field__toggle-icon field__toggle-icon--show" alt="Ícono de ojo" width="20" height="20"
                     src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0'/%3E%3Ccircle cx='12' cy='12' r='3'/%3E%3C/svg%3E">
                <img class="field__toggle-icon field__toggle-icon--hide" alt="Ícono de ojo tachado" width="20" height="20"
                     src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49'/%3E%3Cpath d='M14.084 14.158a3 3 0 0 1-4.242-4.242'/%3E%3Cpath d='M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143'/%3E%3Cpath d='m2 2 20 20'/%3E%3C/svg%3E">
              </button>
            </div>
            <p class="field__note" id="reg-password-note">Use letras, números y símbolos para mayor seguridad.</p>
          </div>
        </div>

        <label class="notice">
          <input class="notice__checkbox" type="checkbox" name="acepto" required>
          <span class="notice__text">Acepto los <a class="notice__link" href="#">Términos y Condiciones</a> y el tratamiento de mis datos personales conforme al aviso de privacidad de AMAC.</span>
        </label>

        <button class="register-card__submit" type="submit">Completar Registro</button>

        <p class="register-card__signin">
          <span class="register-card__signin-text">¿Ya tienes cuenta?</span>
          <a class="register-card__signin-link" href="login.html">Inicia sesión aquí</a>
        </p>
      </form>

      <p class="help-link">
        <img class="help-link__icon" alt="Ícono de ayuda" width="18" height="18"
             src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a5565' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpath d='M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3'/%3E%3Cpath d='M12 17h.01'/%3E%3C/svg%3E">
        <span class="help-link__text">¿Necesitas ayuda?</span>
        <a class="help-link__action" href="#">Contáctanos</a>
      </p>
    </section>

    <a class="help-fab" href="tel:">
      <img class="help-fab__icon" alt="Ayuda / Llamar" width="20" height="20"
           src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z'/%3E%3C/svg%3E">
    </a>
  </main>

  <script>
    (function () {
      /* Navigation toggle */
      var toggle = document.querySelector('.site-header__toggle');
      var nav = document.getElementById('site-nav');
      var mq = window.matchMedia('(max-width: 1024px)');

      function setOpen(open) {
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Cerrar menú de navegación' : 'Abrir menú de navegación');
        nav.classList.toggle('site-nav--open', open);
      }

      toggle.addEventListener('click', function () {
        setOpen(toggle.getAttribute('aria-expanded') !== 'true');
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
          setOpen(false);
          toggle.focus();
        }
      });

      mq.addEventListener('change', function (e) {
        if (!e.matches) setOpen(false);
      });

      /* Password visibility (eye icon) */
      var eye = document.querySelector('.field__toggle');
      var password = document.getElementById('reg-password');

      eye.addEventListener('click', function () {
        var show = password.type === 'password';
        password.type = show ? 'text' : 'password';
        eye.setAttribute('aria-pressed', String(show));
        eye.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
      });
    })();
  </script>
</body>
</html>
